<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarry &amp; Co. Architecture in quiet stone</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{background:#e4dfd6}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#26221e;height:340vh}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:2vw;padding:0 6vw}
  .stage::before{content:"";position:absolute;inset:0;background:
    linear-gradient(rgba(38,34,30,.05) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,rgba(38,34,30,.05) 1px,transparent 1px) 0 0/40px 40px}
  .copy{position:relative;z-index:2}
  .eyebrow{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;padding:9px 16px;border:1px solid rgba(38,34,30,.35);border-radius:999px}
  h1{margin-top:24px;font-family:"Didot","Bodoni 72",Georgia,serif;font-weight:400;font-size:clamp(48px,6.4vw,96px);line-height:.98;letter-spacing:-.02em}
  h1 em{font-style:italic;color:#c4552d}
  .lede{margin-top:20px;max-width:430px;font-size:18px;line-height:1.55;color:#4a433c}
  .ctas{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
  .btn{padding:15px 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none}
  .primary{background:#26221e;color:#e4dfd6}.ghost{border:1px solid #26221e;color:#26221e}
  .scene{position:relative;z-index:1;height:100vh;display:grid;place-items:center}
  svg.iso{width:min(620px,52vw);height:auto;overflow:visible}
  .blk{opacity:0}
  .blk.in{opacity:1;animation:drop .5s steps(5,end) both}
  @keyframes drop{0%{transform:translateY(-260px)}70%{transform:translateY(8px)}100%{transform:translateY(0)}}
  .hook{animation:swing 2.4s steps(8,end) infinite alternate;transform-origin:430px 20px}
  @keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
  .counter{position:absolute;right:6vw;bottom:6vh;z-index:2;font:500 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:#4a433c}
  .counter b{color:#c4552d;font-weight:600}
  @media (max-width:820px){.stage{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:12vh 6vw 0}.scene{height:auto}svg.iso{width:84vw}}
  @media (prefers-reduced-motion:reduce){.blk.in{animation:none}.hook{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="copy">
    <span class="eyebrow">Quarry &amp; Co Architects</span>
    <h1>We build in <em>quiet</em> stone.</h1>
    <p class="lede">Civic buildings, homes and chapels shaped from local rock, set one course at a time.</p>
    <div class="ctas"><a class="btn primary" href="#">See the work</a><a class="btn ghost" href="#">Start a project</a></div>
  </div>
  <div class="scene"><svg class="iso" id="iso" viewBox="0 0 620 560" aria-hidden="true"></svg></div>
  <div class="counter" aria-hidden="true">FRAME <b id="fr">00</b> / <span id="tot">00</span></div>
</div>
<script>
(()=>{
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS='http://www.w3.org/2000/svg', svg=document.getElementById('iso');
  const S=46, C=Math.cos(Math.PI/6), Sn=.5, OX=310, OY=330;
  const P=(x,y,z)=>[OX+(x-y)*C*S, OY+(x+y)*Sn*S - z*S];
  const pts=a=>a.map(p=>p.join(',')).join(' ');
  const shade=['#cfc7bb','#b3a998','#958a79'];
  // the building: footprint 3 x 3, four courses, a rust lintel and a capstone
  const blocks=[];
  for(let z=0;z<4;z++)for(let x=0;x<3;x++)for(let y=0;y<3;y++){
    if(z>=2&&x===1&&y===2)continue; // doorway void
    if(z===3&&(x===0&&y===0))continue;
    blocks.push({x,y,z,accent:(z===2&&y===2&&x!==1)});
  }
  blocks.push({x:1,y:1,z:4,accent:true});
  // painter's order for drawing, construction order for timing
  const draw=[...blocks].sort((a,b)=>(a.z-b.z)||((a.x+a.y)-(b.x+b.y))||(a.x-b.x));
  const els=new Map();
  // ground slab
  const g=document.createElementNS(NS,'polygon');g.setAttribute('points',pts([P(-.4,-.4,0),P(3.4,-.4,0),P(3.4,3.4,0),P(-.4,3.4,0)]));g.setAttribute('fill','#d2cbc0');svg.appendChild(g);
  // crane
  const crane=document.createElementNS(NS,'g');crane.innerHTML=`<path d="M560 520 V10 H330" stroke="#26221e" stroke-width="3" fill="none"/><path d="M560 60 L520 10 M560 120 L470 10" stroke="#26221e" stroke-width="1.5" fill="none"/><g class="hook"><line x1="430" y1="10" x2="430" y2="110" stroke="#26221e" stroke-width="1.5"/><path d="M424 110 h12 v8 a6 6 0 0 1 -12 0z" fill="#c4552d"/></g>`;svg.appendChild(crane);
  draw.forEach(b=>{
    const {x,y,z}=b, top=[P(x,y,z+1),P(x+1,y,z+1),P(x+1,y+1,z+1),P(x,y+1,z+1)],
      left=[P(x,y+1,z),P(x+1,y+1,z),P(x+1,y+1,z+1),P(x,y+1,z+1)],
      right=[P(x+1,y,z),P(x+1,y+1,z),P(x+1,y+1,z+1),P(x+1,y,z+1)];
    const grp=document.createElementNS(NS,'g');grp.setAttribute('class','blk');
    const fill=b.accent?['#d9744d','#c4552d','#9f4122']:shade;
    [[top,fill[0]],[left,fill[1]],[right,fill[2]]].forEach(([poly,c])=>{const p=document.createElementNS(NS,'polygon');p.setAttribute('points',pts(poly));p.setAttribute('fill',c);p.setAttribute('stroke','rgba(38,34,30,.25)');p.setAttribute('stroke-width','.8');grp.appendChild(p);});
    svg.appendChild(grp);els.set(b,grp);
  });
  const build=[...blocks].sort((a,b)=>(a.z-b.z)||((a.x+a.y)-(b.x+b.y)));
  const total=build.length; document.getElementById('tot').textContent=String(total).padStart(2,'0');
  const fr=document.getElementById('fr');
  let shown=0, introDone=false;
  const setShown=n=>{n=Math.max(0,Math.min(total,n));if(n===shown)return;
    build.forEach((b,i)=>{const el=els.get(b);if(i<n){if(!el.classList.contains('in')){el.classList.add('in');}}else el.classList.remove('in');});
    shown=n;fr.textContent=String(n).padStart(2,'0');};
  // on load the first course is laid in stop-motion, then scroll lays the rest
  const firstCourse=build.filter(b=>b.z===0).length;
  if(reduce)setShown(total);else{let i=0;const t=setInterval(()=>{setShown(++i);if(i>=firstCourse){clearInterval(t);introDone=true;}},140);}
  addEventListener('scroll',()=>{if(reduce||!introDone)return;const max=document.body.scrollHeight-innerHeight;const p=max>0?scrollY/max:0;
    setShown(Math.round(firstCourse+(total-firstCourse)*Math.min(1,p/0.85)));},{passive:true});
})();
</script>
</body>
</html>
