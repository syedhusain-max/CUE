<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift. Coffee roasted after dark</title>
<style>
  :root{--neon:#ff4f8b;--neon2:#55e6ff;--glow:0}
  *{box-sizing:border-box;margin:0}
  html,body{background:#0b0709}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4ece6;height:300vh}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center}
  .wall{position:absolute;inset:0;
    background:
      radial-gradient(60% 50% at 50% 42%, rgba(255,79,139,calc(.10 + .22 * var(--glow))), transparent 70%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(0,0,0,.55) 46px 49px),
      repeating-linear-gradient(90deg, transparent 0 104px, rgba(0,0,0,.45) 104px 107px),
      linear-gradient(180deg,#2a1418,#160b0e 70%,#0b0709)}
  .wall::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 52px,rgba(0,0,0,.45) 52px 55px) 0 49px/100% 98px no-repeat;opacity:.0}
  .copy{position:relative;z-index:2;text-align:center;width:min(1100px,92vw)}
  .eyebrow{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#f4ece6;opacity:.7;
    padding:9px 16px;border:1px solid rgba(244,236,230,.3);border-radius:999px}
  .sign{margin:30px auto 0;font-family:"Avenir Next Condensed","Arial Narrow",ui-sans-serif,sans-serif;font-weight:700;
    font-size:clamp(64px,13vw,168px);letter-spacing:.04em;line-height:.95;text-transform:uppercase;display:flex;justify-content:center;flex-wrap:wrap;gap:0 .25em}
  .w{display:inline-flex}
  .l{color:#3a1b24;transition:color .05s;text-shadow:none}
  .l.on{color:#ffe3ee;text-shadow:0 0 6px #fff,0 0 18px var(--neon),0 0 42px var(--neon),0 0 90px var(--neon)}
  .l.on.flick{animation:flick 4.2s steps(1) infinite}
  @keyframes flick{0%,6%,9%,100%{opacity:1}7%,8.5%{opacity:.25}}
  .lede{margin:26px auto 0;max-width:500px;font-size:19px;line-height:1.5;color:#e8d8d2;opacity:.85}
  .cta-wrap{margin-top:34px;display:flex;justify-content:center}
  .cta{position:relative;display:inline-block;padding:17px 30px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;color:#0b0709;
    background:var(--neon2);box-shadow:0 0 0 1px rgba(85,230,255,.6),0 0 28px rgba(85,230,255,.55);transform:translate(var(--mx,0px),var(--my,0px));transition:transform .25s cubic-bezier(.2,.9,.3,1.2)}
  .cta span{display:inline-block;transform:translate(calc(var(--mx,0px) * .35),calc(var(--my,0px) * .35));transition:transform .25s}
  .cup{position:absolute;z-index:1;right:9vw;bottom:9vh;width:min(230px,26vw);opacity:calc(.25 + .75 * var(--glow))}
  .cup path,.cup rect{stroke:var(--neon2);stroke-width:4;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--neon2));
    stroke-dasharray:400;stroke-dashoffset:calc(400 - 400 * var(--glow))}
  .steam path{stroke:#f4ece6;stroke-width:3;fill:none;opacity:.5;stroke-linecap:round;animation:steam 3.4s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:-1.1s}.steam path:nth-child(3){animation-delay:-2.2s}
  @keyframes steam{0%{transform:translateY(10px);opacity:0}40%{opacity:.6}100%{transform:translateY(-26px);opacity:0}}
  .tag{position:absolute;left:9vw;bottom:10vh;z-index:1;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--neon);
    text-shadow:0 0 12px var(--neon);opacity:calc(.3 + .7 * var(--glow))}
  @media (max-width:720px){.cup{display:none}.tag{left:50%;transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.l.on.flick,.steam path{animation:none}.cta,.cta span{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="wall"></div>
  <div class="copy">
    <span class="eyebrow">Small batch roastery</span>
    <h1 class="sign" id="sign" aria-label="Night Shift"></h1>
    <p class="lede">Beans roasted between midnight and dawn, on your doorstep before your alarm.</p>
    <div class="cta-wrap"><a class="cta" id="cta" href="#"><span>Order this week's roast</span></a></div>
  </div>
  <div class="tag" aria-hidden="true">Open 22:00 to 06:00</div>
  <svg class="cup" viewBox="0 0 220 220" aria-hidden="true">
    <g class="steam"><path d="M80 70 q-10 -14 0 -28 q10 -14 0 -28"/><path d="M110 70 q-10 -14 0 -28 q10 -14 0 -28"/><path d="M140 70 q-10 -14 0 -28 q10 -14 0 -28"/></g>
    <path d="M40 90 h140 v40 a70 60 0 0 1 -140 0 z"/>
    <path d="M180 104 h14 a22 22 0 0 1 0 44 h-22"/>
    <path d="M24 200 h172"/>
  </svg>
</div>
<script>
(()=>{
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sign=document.getElementById('sign'), stage=document.getElementById('stage'), cta=document.getElementById('cta');
  const letters=[];
  'NIGHT SHIFT'.split(' ').forEach(word=>{const w=document.createElement('span');w.className='w';w.setAttribute('aria-hidden','true');
    [...word].forEach(ch=>{const l=document.createElement('span');l.className='l';l.textContent=ch;w.appendChild(l);letters.push(l);});sign.appendChild(w);});
  // ignition: letters strike on one at a time with a stuttering stop-motion flicker
  const order=[0,4,1,9,3,6,2,8,5,7];
  const strike=(l,i)=>{if(reduce){l.classList.add('on');return;}
    const seq=[1,0,1,0,0,1,0,1,1];seq.forEach((v,k)=>setTimeout(()=>l.classList.toggle('on',!!v),i*170+k*55));
    setTimeout(()=>{if(i%3===1)l.classList.add('flick')},i*170+600);};
  order.forEach((idx,i)=>letters[idx]&&strike(letters[idx],i));
  // scroll turns the whole room up: wall glow, cup outline draws itself
  const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
  let g=0;
  const loop=()=>{const max=document.body.scrollHeight-innerHeight;const p=max>0?scrollY/max:0;g+=(clamp(p/0.7)-g)*(reduce?1:.1);
    stage.style.setProperty('--glow',g.toFixed(3));requestAnimationFrame(loop)};loop();
  // magnetic call to action
  addEventListener('pointermove',e=>{if(reduce)return;const r=cta.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),R=160;
    if(d<R){const k=(1-d/R)*.45;cta.style.setProperty('--mx',(dx*k)+'px');cta.style.setProperty('--my',(dy*k)+'px');}
    else{cta.style.setProperty('--mx','0px');cta.style.setProperty('--my','0px');}},{passive:true});
})();
</script>
</body>
</html>
