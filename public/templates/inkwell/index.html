<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell. Pens for people who still write</title>
<style>
  :root{--paper:#f2ebdd;--ink:#16245e;--ink2:#0d1640;--nib:#b8893a;--p:0}
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--paper)}
  body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:var(--ink);height:320vh}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center}
  .grain{position:absolute;inset:0;opacity:.35;pointer-events:none;
    background-image:radial-gradient(rgba(22,36,94,.08) 1px,transparent 1px);background-size:5px 5px}
  .rule{position:absolute;left:8vw;right:8vw;height:1px;background:rgba(22,36,94,.12)}
  .bleed{position:absolute;left:50%;top:58%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;pointer-events:none;
    transform:scale(calc(var(--b,0) * 1));transform-origin:50% 50%}
  .bleed svg{width:100%;height:100%}
  .copy{position:relative;z-index:2;width:min(1100px,90vw);text-align:center}
  .eyebrow{display:inline-block;font:600 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;
    padding:9px 16px;border:1px solid currentColor;border-radius:999px;opacity:.8}
  h1{margin:26px 0 0}
  h1 svg{width:100%;height:auto;overflow:visible}
  .word{font-size:132px;font-weight:600;letter-spacing:-.02em;fill:transparent;stroke:currentColor;stroke-width:1.4;
    stroke-dasharray:900;stroke-dashoffset:calc(900 - 900 * var(--d,0));fill-opacity:var(--f,0)}
  .word{fill:currentColor}
  .lede{font:400 20px/1.5 ui-sans-serif,system-ui,sans-serif;max-width:520px;margin:18px auto 0;opacity:calc(.3 + .7 * var(--f,0))}
  .ctas{margin-top:30px;display:flex;gap:12px;justify-content:center}
  .btn{font:600 15px/1 ui-sans-serif,system-ui,sans-serif;padding:15px 24px;border-radius:999px;text-decoration:none;transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
  .btn:hover{transform:translateY(-2px)}
  .primary{background:var(--ink);color:var(--paper)}
  .ghost{border:1px solid currentColor;color:inherit}
  .pen{position:absolute;z-index:3;width:300px;left:50%;top:50%;pointer-events:none;
    transform:translate(calc(-50% + var(--px,0) * 1px),calc(-50% + var(--py,0) * 1px)) rotate(-38deg);transform-origin:20% 50%;
    transition:transform .08s linear}
  .drip{animation:drip 2.6s ease-in infinite}
  @keyframes drip{0%,55%{transform:translateY(0) scale(0);opacity:0}60%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(46px) scale(.6);opacity:0}}
  .inverted{color:var(--paper)}
  .inverted .primary{background:var(--paper);color:var(--ink)}
  @media (max-width:720px){.word{font-size:150px}.pen{width:180px}.lede{font-size:17px}}
  @media (prefers-reduced-motion:reduce){.drip{animation:none}.pen{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="grain"></div>
  <div class="rule" style="top:22%"></div><div class="rule" style="top:78%"></div>
  <div class="bleed" id="bleed" aria-hidden="true">
    <svg viewBox="-100 -100 200 200">
      <defs>
        <filter id="wobble" x="-50%" y="-50%" width="200%" height="200%">
          <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
        </filter>
        <radialGradient id="ig" r=".5"><stop offset="0" stop-color="#0d1640"/><stop offset=".8" stop-color="#16245e"/><stop offset="1" stop-color="#1d2f78"/></radialGradient>
      </defs>
      <g filter="url(#wobble)">
        <circle r="60" fill="url(#ig)"/>
        <circle cx="38" cy="-30" r="22" fill="#16245e"/><circle cx="-44" cy="26" r="26" fill="#16245e"/>
        <circle cx="-20" cy="-52" r="14" fill="#16245e"/><circle cx="30" cy="48" r="18" fill="#16245e"/>
      </g>
    </svg>
  </div>
  <div class="copy" id="copy">
    <span class="eyebrow">Inkwell Pens</span>
    <h1 aria-label="Write like it matters.">
      <svg viewBox="0 0 1200 200" aria-hidden="true"><text class="word" x="600" y="148" text-anchor="middle" textLength="1120" lengthAdjust="spacingAndGlyphs">Write like it matters.</text></svg>
    </h1>
    <p class="lede">Hand-tuned fountain pens with gold nibs, ground to the way you hold them.</p>
    <div class="ctas"><a class="btn primary" href="#">Find your nib</a><a class="btn ghost" href="#">Visit the studio</a></div>
  </div>
  <svg class="pen" id="pen" viewBox="0 0 300 60" aria-hidden="true">
    <rect x="70" y="16" width="200" height="28" rx="14" fill="#0d1640"/>
    <rect x="236" y="14" width="10" height="32" rx="3" fill="#b8893a"/>
    <path d="M70 18 L18 30 L70 42 Z" fill="#b8893a"/>
    <path d="M18 30 L52 30" stroke="#0d1640" stroke-width="1.6"/>
    <circle cx="44" cy="30" r="2.4" fill="#0d1640"/>
    <circle class="drip" cx="18" cy="34" r="4" fill="#16245e"/>
  </svg>
</div>
<script>
(()=>{
  const root=document.documentElement, stage=document.getElementById('stage'), copy=document.getElementById('copy'), pen=document.getElementById('pen');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), seg=(p,a,b)=>clamp((p-a)/(b-a));
  const ease=t=>1-Math.pow(1-t,3);
  let target=0,cur=0, idle=0, mx=0,my=0;
  function progress(){const max=document.body.scrollHeight-innerHeight;return max>0?scrollY/max:0}
  addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5)},{passive:true});
  function frame(t){
    target=progress(); cur+= (target-cur)*(reduce?1:.12); idle=t/1000;
    // intro draw on load, then scroll continues the story
    const intro=reduce?1:clamp(t/1800);
    const d=Math.max(ease(intro), seg(cur,0,.25));
    const f=Math.max(seg(intro,.6,1), seg(cur,.15,.35));
    const b=ease(seg(cur,.4,.95));
    copy.style.setProperty('--d',d.toFixed(3));
    copy.style.setProperty('--f',f.toFixed(3));
    document.getElementById('bleed').style.setProperty('--b',b.toFixed(3));
    copy.classList.toggle("inverted",b>.45);
    // pen glides across the headline while it draws, then settles near the bleed origin
    const sweep=Math.min(1,d);
    const px=(-460+1000*sweep)+mx*40+(reduce?0:Math.sin(idle*1.3)*6);
    const py=(-70+ b*170)+my*30+(reduce?0:Math.cos(idle*1.1)*4);
    pen.style.setProperty('--px',px.toFixed(1)); pen.style.setProperty('--py',py.toFixed(1));
    pen.style.opacity=(1-seg(b,.6,1)).toFixed(2);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
